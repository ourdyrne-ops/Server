<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Course Player - Telegram Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .player-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Dynamic moving watermark */
    .watermark-overlay {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 50;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
      transition: all 1.2s ease-in-out;
    }
    .watermark-time {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.4);
    }
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 60;
    }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      margin-top: 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <video id="videoPlayer" controls playsinline></video>

    <!-- Moving Watermark Overlay -->
    <div id="watermark" class="watermark-overlay" style="display: none; top: 15%; left: 15%;">
      <div id="watermarkText">TG: User</div>
      <div id="watermarkTime" class="watermark-time">00:00:00 UTC</div>
    </div>

    <!-- Status / Error Overlay -->
    <div id="statusOverlay" class="status-overlay">
      <div id="spinner" class="spinner"></div>
      <div id="statusMessage" style="font-size: 14px;">Authorizing protected stream...</div>
      <button id="retryBtn" class="btn" style="display: none;" onclick="initStream()">Retry</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('contentId');
    const video = document.getElementById('videoPlayer');
    const watermark = document.getElementById('watermark');
    const watermarkText = document.getElementById('watermarkText');
    const watermarkTime = document.getElementById('watermarkTime');
    const statusOverlay = document.getElementById('statusOverlay');
    const statusMessage = document.getElementById('statusMessage');
    const spinner = document.getElementById('spinner');
    const retryBtn = document.getElementById('retryBtn');

    let currentSession = null;
    let currentToken = '';
    let hlsInstance = null;
    let renewalTimer = null;

    const positions = [
      { top: '10%', left: '10%' },
      { top: '10%', left: '60%' },
      { top: '45%', left: '35%' },
      { top: '75%', left: '12%' },
      { top: '75%', left: '62%' },
      { top: '45%', left: '68%' }
    ];

    function updateWatermarkPosition() {
      const now = new Date();
      watermarkTime.textContent = now.toTimeString().split(' ')[0] + ' UTC';
      const pos = positions[Math.floor(Math.random() * positions.length)];
      watermark.style.top = pos.top;
      watermark.style.left = pos.left;
    }

    setInterval(updateWatermarkPosition, 10000);

    async function initStream() {
      if (!contentId) {
        showError('Missing contentId in URL parameter');
        return;
      }

      showLoading('Authorizing stream with Telegram identity...');

      try {
        const initData = tg?.initData || urlParams.get('initData') || '';
        const res = await fetch('/api/stream/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contentId, initData })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Authorization failed (' + res.status + ')');
        }

        const data = await res.json();
        currentSession = data;
        currentToken = data.token;

        // Configure watermark
        watermarkText.textContent = data.watermarkText;
        watermark.style.display = 'block';
        updateWatermarkPosition();

        mountPlayer(data.playlistUrl);
        setupTokenRenewal(data.sessionId);
        hideOverlay();
      } catch (err) {
        showError(err.message);
      }
    }

    function mountPlayer(playlistUrl) {
      if (hlsInstance) {
        hlsInstance.destroy();
      }

      if (Hls.isSupported()) {
        hlsInstance = new Hls({
          enableWorker: true,
          xhrSetup: (xhr) => {
            xhr.setRequestHeader('X-Playback-Session', currentSession.sessionId);
          }
        });

        hlsInstance.loadSource(playlistUrl);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            if (data.response?.code === 403) {
              showError('Playback session revoked or expired.');
              hlsInstance.destroy();
            } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              hlsInstance.startLoad();
            } else {
              hlsInstance.destroy();
              showError('Unrecoverable stream playback error');
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = playlistUrl;
      } else {
        showError('HLS playback is not supported on this browser');
      }
    }

    function setupTokenRenewal(sessionId) {
      if (renewalTimer) clearInterval(renewalTimer);
      // Renew token every 90s (for 180s TTL)
      renewalTimer = setInterval(async () => {
        try {
          const res = await fetch(`/api/stream/session/${sessionId}/renew`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: currentToken })
          });

          if (!res.ok) {
            throw new Error('Renewal failed');
          }

          const data = await res.json();
          currentToken = data.token;
        } catch (err) {
          video.pause();
          showError('Subscription expired or session revoked during playback');
        }
      }, 90000);
    }

    function showLoading(msg) {
      statusOverlay.style.display = 'flex';
      spinner.style.display = 'block';
      retryBtn.style.display = 'none';
      statusMessage.textContent = msg;
    }

    function showError(msg) {
      statusOverlay.style.display = 'flex';
      spinner.style.display = 'none';
      retryBtn.style.display = 'block';
      statusMessage.textContent = msg;
    }

    function hideOverlay() {
      statusOverlay.style.display = 'none';
    }

    initStream();
  </script>
</body>
</html>
